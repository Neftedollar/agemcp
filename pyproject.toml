[project]
name = "agemcp"
version = "0.7.0"
description = "Apache AGE (PostgreSQL Graph) MCP Server"
readme = "README.md"
authors = [
    { name = "veloper" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.4",
    "blinker>=1.9.0",
    "click>=8.2.1",
    "fastmcp>=2.8.1",
    "networkx>=3.5",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.0.0",
    "pyvis>=0.3.2",
    "rich>=13.0.0",
    "sqlalchemy[asyncio]>=2.0.41",
]

[project.optional-dependencies]
vector = ["fastembed>=0.4.0"]

[project.scripts]
agemcp = "agemcp:cli.main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-sugar>=1.0.0",
    "pytest-timeout>=2.4.0"
]

[tool.pytest.ini_options]
describe_prefixes = ["describe_"]

[tool.uv]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
